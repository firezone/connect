name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm run check
      - run: npm test
      - run: npm run test:systemd
      - name: Reject an invalid token using the released client
        id: invalid-token
        continue-on-error: true
        uses: ./
        with:
          token: invalid-token-for-setup-firezone-ci
          connect-timeout: 5s
      - name: Verify failed startup cleaned up
        if: always() && steps.invalid-token.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.invalid-token.outcome }}
          CLIENT_LOG: ${{ steps.invalid-token.outputs.log-path }}
        run: |
          test "$OUTCOME" = failure
          grep -q "started logging" "$CLIENT_LOG"
          test -z "$(sudo find /run -maxdepth 1 -name 'setup-firezone-*' -print -quit)"
          ! ip link show tun-firezone
